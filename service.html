<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Service & Support</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            background: #f4f4f4;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 8px 16px;
            border-bottom: 2px solid #ccc;
            margin-bottom: 30px;
        }
        .header img {
            height: 50px;
        }
        .header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }
        .header nav a {
            text-decoration: none;
            font-weight: bold;
            color: #333;
        }
        .login-box {
            background: #fff;
            padding: 30px 40px;
            max-width: 400px;
            margin: 60px auto;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .login-box h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .login-box label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .login-box input {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background: #4caf50;
            color: #fff;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        .login-box button:hover {
            background: #45a045;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="LOGO.bmp" alt="Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Generator</a></li>
                <li><a href="service.html">Service &amp; Support</a></li>
            </ul>
        </nav>
    </div>

    <div class="login-box">
        <h2>Service Login</h2>
        <form action="login.php" method="post">
            <label for="username">Benutzername</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Anmelden</button>
        </form>
    </div>
</body>
</html>
